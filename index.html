<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practice</title>
    <style>
        /* 按钮和输入框的样式 */
        button, input {
            padding: 5px 10px;
            border-radius: 4px;
        }
        /* 居中样式 */
        body {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <h1>JS Practice</h1>

    <!-- 计数器 -->
    <section>
        <h2>Counter</h2>
        <div id="count-display">0</div>
        <button id="increment-btn">+1</button>
        <button id="decrement-btn">-1</button>
        <button id="reset-btn">Reset</button>
    </section>

    <!-- 待办事项列表 -->
    <section>
        <h2>Todo List</h2>
        <div class="todo-row">
            <input type="text" id="todo-input" placeholder="Add a task...">
            <button id="add-btn">Add</button>
        </div>
        <ul id="todo-list"></ul>
    </section>

    <script src="script.js"></script>
</body>
</html>
